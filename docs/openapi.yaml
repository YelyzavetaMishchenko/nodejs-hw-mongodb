openapi: 3.1.0
info:
  version: 1.0.0
  title: Contacts API
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  description: |
    REST API for managing contacts with authentication, image upload, and email functionality.
tags: []
servers:
  - url: http://localhost:3000
  - url: https://contacts-app-h0wk.onrender.com
paths:
  /contacts/{contactId}:
    get:
      $ref: ../swagger/paths/contacts/_id/get.yaml
    patch:
      $ref: ../swagger/paths/contacts/_id/patch.yaml
    delete:
      $ref: ../swagger/paths/contacts/_id/delete.yaml

  /contacts:
    get:
      $ref: ../swagger/paths/contacts/get.yaml
    post:
      $ref: ../swagger/paths/contacts/post.yaml
components:
  schemas:
    Contact:
      $ref: '../swagger/components/schemas/contact.yaml#/Contact'
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
