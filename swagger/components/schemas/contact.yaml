Contact:
  type: object
  required:
    - name
    - email
    - phone
  properties:
    _id:
      type: string
      example: 64b167857c7c4dbf7c4aefb2
    name:
      type: string
      example: John Doe
    email:
      type: string
      example: john@example.com
    phone:
      type: string
      example: '+1234567890'
    favorite:
      type: boolean
      example: false
