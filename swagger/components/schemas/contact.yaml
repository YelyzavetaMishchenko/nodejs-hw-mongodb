type: object
required:
  - name
  - email
  - phoneNumber
properties:
  _id:
    type: string
    example: 64b167857c7c4dbf7c4aefb2
  name:
    type: string
    example: John Doe
  email:
    type: string
    example: john@example.com
  phoneNumber:
    type: string
    example: '+1234567890'
  isFavourite:
    type: boolean
    example: false
  contactType:
    type: string
    example: personal
