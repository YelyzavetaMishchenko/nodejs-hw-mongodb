tags:
  - Contacts
summary: Create a new contact
operationId: addContact
description: Create a new contact
security:
  - bearerAuth: []
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        properties:
          name:
            type: string
            example: Alice Smith
          email:
            type: string
            format: email
            example: alice@example.com
          phoneNumber:
            type: string
            example: '+1234567890'
          isFavourite:
            type: boolean
            example: false
          contactType:
            type: string
            enum:
              - work
              - home
              - personal
            example: personal
responses:
  '201':
    description: Contact created successfully
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 201
            message:
              type: string
              example: Contact created successfully
            data:
              type: object
              properties:
                data:
                  $ref: '../../components/schemas/contact.yaml#/type'
  '400':
    description: Bad Request
  '401':
    description: Unauthorized
