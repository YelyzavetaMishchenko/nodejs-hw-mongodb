tags:
  - Contacts
summary: Create a new contact
operationId: createContact
description: Add a new contact for the authorized user
security:
  - bearerAuth: []
requestBody:
  required: true
  content:
    multipart/form-data:
      schema:
        type: object
        required:
          - name
          - email
          - phone
        properties:
          name:
            type: string
            example: Alice Smith
          email:
            type: string
            format: email
            example: alice@example.com
          phone:
            type: string
            example: '+1234567890'
          favorite:
            type: boolean
            example: false
responses:
  '201':
    description: Contact created successfully
    content:
      application/json:
        schema:
          $ref: '../../components/schemas/contact.yaml#/Contact'
  '400':
    description: Validation error
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: string
              example: error
            message:
              type: string
              example: Validation failed
  '401':
    description: Unauthorized
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: string
              example: error
            message:
              type: string
              example: Unauthorized
