tags:
  - Contacts
summary: Update contact by ID
operationId: updateContactById
description: Update an existing contact using its ID
security:
  - bearerAuth: []
parameters:
  - name: contactId
    in: path
    required: true
    schema:
      type: string
      example: 64b167857c7c4dbf7c4aefb2
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        properties:
          name:
            type: string
            example: Alice Smith
          email:
            type: string
            format: email
            example: alice@example.com
          phoneNumber:
            type: string
            example: '+1234567890'
          isFavourite:
            type: boolean
            example: true
          contactType:
            type: string
            enum:
              - work
              - home
              - personal
            example: personal
responses:
  '200':
    description: Contact updated successfully
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Contact updated successfully
            data:
              type: object
              properties:
                data:
                  $ref: '../../../components/schemas/contact.yaml#/type'
  '400':
    description: Invalid input
  '401':
    description: Unauthorized
  '404':
    description: Contact not found
