tags:
  - Contacts
summary: Get contact by ID
operationId: getContactById
description: Retrieve a contact by its unique ID
security:
  - bearerAuth: []
parameters:
  - name: contactId
    in: path
    required: true
    schema:
      type: string
      example: 64b167857c7c4dbf7c4aefb2
responses:
  '200':
    description: Contact found
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Success
            data:
              type: object
              properties:
                data:
                  $ref: '../../../components/schemas/contact.yaml#/type'
  '401':
    description: Unauthorized
  '404':
    description: Contact not found
