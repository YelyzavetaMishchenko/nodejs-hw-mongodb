tags:
  - Contacts
summary: Get contact by ID
operationId: getContactById
description: Retrieve a contact by its unique ID
security:
  - bearerAuth: []
parameters:
  - name: contactId
    in: path
    required: true
    description: The ID of the contact
    schema:
      type: string
      example: 64b167857c7c4dbf7c4aefb2
responses:
  '200':
    description: Contact found
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: string
              example: success
            message:
              type: string
              example: Contact found
            data:
              type: object
              properties:
                contact:
                  $ref: '../../../components/schemas/contact.yaml#/Contact'
  '404':
    description: Contact not found
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: string
              example: error
            message:
              type: string
              example: Contact not found
