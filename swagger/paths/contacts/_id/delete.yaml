tags:
  - Contacts
summary: Delete contact by ID
operationId: deleteContactById
description: Remove a contact using its ID
security:
  - bearerAuth: []
parameters:
  - name: contactId
    in: path
    required: true
    schema:
      type: string
      example: 64b167857c7c4dbf7c4aefb2
responses:
  '204':
    description: Contact deleted successfully (No Content)
  '401':
    description: Unauthorized
  '404':
    description: Contact not found
