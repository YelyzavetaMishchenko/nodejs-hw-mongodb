tags:
  - Contacts
summary: Delete contact by ID
operationId: deleteContactById
description: Remove a contact using its ID
security:
  - bearerAuth: []
parameters:
  - name: contactId
    in: path
    required: true
    description: The ID of the contact to delete
    schema:
      type: string
      example: 64b167857c7c4dbf7c4aefb2
responses:
  '204':
    description: Contact deleted successfully
  '401':
    description: Unauthorized
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: string
              example: error
            message:
              type: string
              example: Unauthorized
  '404':
    description: Contact not found
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: string
              example: error
            message:
              type: string
              example: Contact not found
